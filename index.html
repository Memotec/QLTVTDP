<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNS/ATM ASSET MGMT - VATM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --p: #1e40af; --bg: #f8fafc; --success: #16a34a; --danger: #ef4444; --audit: #7c3aed; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); padding-bottom: 60px; }
        .header { background: var(--p); color: white; padding: 15px; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 1200px; margin: auto; padding: 15px; display: none; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h3 { font-size: 11px; color: var(--p); text-transform: uppercase; margin-bottom: 15px; border-left: 4px solid var(--p); padding-left: 10px; }
        
        /* Form & Input */
        .form-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
        input { width: 100%; height: 40px; padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .btn-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 15px; }
        button { height: 44px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        
        /* Table */
        .table-wrap { overflow-x: auto; background: white; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-size: 13px; }
        
        /* Responsive Mobile Card */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { border: 1px solid #ddd; margin-bottom: 10px; border-radius: 10px; padding: 10px; }
            td { display: flex; justify-content: space-between; text-align: right; padding: 5px 0; }
            td:before { content: attr(data-label); font-weight: bold; color: #666; font-size: 11px; }
            td[data-label="Tên thiết bị"] { display: block; text-align: left; font-size: 15px; font-weight: bold; color: var(--p); border-bottom: 1px solid #eee; }
            td[data-label="Tên thiết bị"]:before { display: none; }
        }

        /* Status Bar */
        .status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 5px 15px; display: flex; justify-content: space-between; border-top: 1px solid #ddd; font-size: 10px; font-weight: bold; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        
        /* Login */
        #login { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; }
    </style>
</head>
<body>

<div id="login">
    <div style="width: 80%; max-width: 300px; text-align: center;">
        <h2 style="color: var(--p); margin-bottom: 20px;">CNS/ATM LOGIN</h2>
        <input type="text" id="u" placeholder="Tài khoản" style="margin-bottom: 10px;">
        <input type="password" id="p" placeholder="Mật khẩu" style="margin-bottom: 20px;">
        <button onclick="doLogin()" style="background: var(--p); width: 100%;">ĐĂNG NHẬP</button>
    </div>
</div>

<div class="header">ĐỘI THÔNG TIN - VATM HCM</div>

<div class="container" id="app">
    <!-- NHẬP LIỆU -->
    <div class="card" id="adminBox" style="display:none;">
        <h3>📦 Thông tin thiết bị</h3>
        <input type="hidden" id="editIdx" value="-1">
        <div class="form-grid">
            <input type="text" id="fName" placeholder="Tên thiết bị *">
            <input type="text" id="fPn" placeholder="P/N">
            <input type="text" id="fSn" placeholder="S/N *">
            <input type="text" id="fWh" placeholder="Mã kho *">
            <input type="text" id="fLoc" placeholder="Vị trí chi tiết">
            <input type="number" id="fQty" value="1">
        </div>
        <div class="btn-group">
            <button onclick="saveItem()" style="background: var(--p);" id="btnSave">LƯU DỮ LIỆU</button>
            <button onclick="resetForm()" style="background: #94a3b8;">HỦY</button>
        </div>
    </div>

    <!-- TÌM KIẾM & NGHIỆP VỤ -->
    <div class="card">
        <h3>🔍 Tìm kiếm & Nghiệp vụ</h3>
        <input type="text" id="search" oninput="render()" placeholder="Tìm S/N, Mã kho, Tên..." style="height: 45px; margin-bottom: 15px;">
        <div class="btn-group">
            <button onclick="openAudit()" style="background: var(--audit);">📝 KIỂM KÊ</button>
            <button onclick="exportExcel()" style="background: var(--success);">📊 XUẤT EXCEL</button>
            <button onclick="location.reload()" style="background: var(--danger);">🚪 ĐĂNG XUẤT</button>
        </div>
    </div>

    <!-- DANH SÁCH -->
    <div class="table-wrap">
        <table>
            <thead>
                <tr><th>STT</th><th>Tên thiết bị</th><th>S/N</th><th>Mã kho</th><th>Kiểm kê</th><th>Thao tác</th></tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>
</div>

<!-- MODAL KIỂM KÊ -->
<div id="auditModal" class="overlay">
    <div style="background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 350px;">
        <h4 style="margin-bottom: 15px;">QUÉT MÃ / KIỂM KÊ</h4>
        <input type="text" id="aSn" placeholder="Quét S/N tại đây..." style="margin-bottom: 15px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button onclick="confirmAudit()" style="background: var(--success);">OK</button>
            <button onclick="closeAudit()" style="background: #999;">ĐÓNG</button>
        </div>
    </div>
</div>

<div class="status-bar">
    <div><span id="sDot" class="dot"></span> <span id="sTxt">SẴN SÀNG</span></div>
    <div id="cId">ID: -</div>
</div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbwjXGWfssk9LCO7ej6cceocrhyaOF9vwJbxgWZli-KwSl-Rk1oSpHf69fABp_JFmCSc/exec"; 
    const STORAGE = "VATM_DB_FINAL";
    const VER_KEY = "VATM_VER_FINAL";
    const CLIENT_ID = "DEV-" + Math.random().toString(36).substr(2, 4).toUpperCase();

    let db = JSON.parse(localStorage.getItem(STORAGE)) || [];
    let ver = parseInt(localStorage.getItem(VER_KEY)) || 0;
    let role = 'guest';

    function doLogin() {
        const user = document.getElementById('u').value.toLowerCase();
        const pass = document.getElementById('p').value;
        if ((user === 'admin' && pass === 'admin') || (user === 'guest' && pass === '123')) {
            role = user;
            document.getElementById('login').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('cId').innerText = `USER: ${user.toUpperCase()} | ${CLIENT_ID}`;
            if(user === 'admin') document.getElementById('adminBox').style.display = 'block';
            render();
            syncPull(); setInterval(syncPull, 10000);
        } else alert("Sai tài khoản!");
    }

    function render() {
        const tbody = document.getElementById('list');
        const kw = document.getElementById('search').value.toLowerCase();
        tbody.innerHTML = '';
        db.forEach((item, i) => {
            if (item.name.toLowerCase().includes(kw) || item.sn.toLowerCase().includes(kw) || item.wh.toLowerCase().includes(kw)) {
                tbody.innerHTML += `
                <tr>
                    <td data-label="STT">${i+1}</td>
                    <td data-label="Tên thiết bị"><b>${item.name}</b></td>
                    <td data-label="S/N"><code>${item.sn}</code></td>
                    <td data-label="Mã kho">${item.wh}</td>
                    <td data-label="Kiểm kê">${item.audit ? '✅' : '-'}</td>
                    <td>
                        <button onclick="editItem(${i})" style="background:var(--p); height:30px; width:50px; font-size:10px; display:inline-flex">SỬA</button>
                    </td>
                </tr>`;
            }
        });
    }

    function saveItem() {
        const name = document.getElementById('fName').value.trim();
        const sn = document.getElementById('fSn').value.trim();
        const idx = document.getElementById('editIdx').value;
        if(!name || !sn) return alert("Thiếu tên hoặc S/N!");

        const obj = { name, sn, pn: document.getElementById('fPn').value, wh: document.getElementById('fWh').value, loc: document.getElementById('fLoc').value, qty: document.getElementById('fQty').value, audit: idx !== "-1" ? db[idx].audit : false };
        if(idx === "-1") db.push(obj); else db[idx] = obj;
        
        saveLocal(); resetForm(); syncPush();
    }

    function editItem(i) {
        if(role !== 'admin') return alert("Không có quyền!");
        const item = db[i];
        document.getElementById('editIdx').value = i;
        document.getElementById('fName').value = item.name;
        document.getElementById('fSn').value = item.sn;
        document.getElementById('fPn').value = item.pn;
        document.getElementById('fWh').value = item.wh;
        document.getElementById('fLoc').value = item.loc;
        document.getElementById('btnSave').innerText = "CẬP NHẬT";
        window.scrollTo(0,0);
    }

    function saveLocal() { localStorage.setItem(STORAGE, JSON.stringify(db)); render(); }
    function resetForm() { document.getElementById('editIdx').value = "-1"; document.querySelectorAll('#adminBox input').forEach(i => i.value = i.id==='fQty'?'1':''); document.getElementById('btnSave').innerText = "LƯU DỮ LIỆU"; }

    function openAudit() { document.getElementById('auditModal').style.display = 'flex'; document.getElementById('aSn').focus(); }
    function closeAudit() { document.getElementById('auditModal').style.display = 'none'; }
    function confirmAudit() {
        const sn = document.getElementById('aSn').value.trim();
        let f = false;
        db = db.map(i => { if(i.sn === sn) { f = true; return {...i, audit: true}; } return i; });
        if(f) { saveLocal(); syncPush(); closeAudit(); document.getElementById('aSn').value = ''; } else alert("Không thấy S/N!");
    }

    async function syncPush() {
        setSt('load', 'Đang lưu Cloud...');
        try {
            const res = await fetch(URL, { method: 'POST', body: JSON.stringify({ action: 'push', data: db, version: ver }) });
            const r = await res.json();
            if(r.status === 'ok') { ver = r.version; localStorage.setItem(VER_KEY, ver); setSt('ok', 'Đã lưu'); }
            else if(r.status === 'conflict') { db = r.data; ver = r.serverVersion; saveLocal(); setSt('ok', 'Xung đột đã xử lý'); }
        } catch(e) { setSt('err', 'Lỗi Cloud'); }
    }

    async function syncPull() {
        try {
            const res = await fetch(`${URL}?action=pull&v=${ver}`);
            const r = await res.json();
            if(r.status === 'ok' && r.data) { db = r.data; ver = r.serverVersion; saveLocal(); setSt('ok', 'Vừa cập nhật'); }
        } catch(e) { }
    }

    function setSt(s, m) {
        document.getElementById('sDot').style.background = s === 'ok' ? 'var(--success)' : (s === 'load' ? 'orange' : 'red');
        document.getElementById('sTxt').innerText = m.toUpperCase();
    }

    function exportExcel() {
        const ws = XLSX.utils.json_to_sheet(db);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, "Inventory.xlsx");
    }
</script>
</body>
</html>
