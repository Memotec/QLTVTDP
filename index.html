<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNS/ATM - SAFE CLOUD SYNC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root { --p: #1e40af; --bg: #f8fafc; --txt: #0f172a; --safe: #059669; --danger: #dc2626; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--txt); padding: 15px; }
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        h3 { font-size: 16px; margin-bottom: 15px; color: var(--p); text-transform: uppercase; border-left: 4px solid var(--p); padding-left: 10px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; font-weight: bold; color: #64748b; }
        input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        input:focus { border-color: var(--p); }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
        button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: 600; font-size: 13px; transition: 0.2s; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th { background: #f1f5f9; padding: 12px; text-align: left; border-bottom: 2px solid #e2e8f0; font-size: 12px; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .status-bar { font-size: 11px; color: #64748b; margin-top: 8px; font-style: italic; }
        #reader { width: 100%; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h3>📦 THÊM THIẾT BỊ MỚI</h3>
        <div class="form-grid">
            <div class="group"><label>Tên thiết bị</label><input type="text" id="fName"></div>
            <div class="group"><label>Số Serial (S/N)</label><input type="text" id="fSN"></div>
            <div class="group"><label>Vị trí</label><input type="text" id="fLoc"></div>
        </div>
        <div class="btn-group">
            <button style="background: var(--p)" onclick="app.add()">Thêm thiết bị</button>
            <button style="background: #64748b" onclick="app.resetForm()">Làm mới</button>
        </div>
    </div>

    <div class="card">
        <h3>⚡ ĐỒNG BỘ VÀ SAO LƯU</h3>
        <div class="btn-group">
            <!-- Nút đồng bộ đã được cải tiến -->
            <button id="syncBtn" style="background: #8b5cf6" onclick="app.syncCloud()">🔄 ĐỒNG BỘ CLOUD (AN TOÀN)</button>
            <button style="background: var(--safe)" onclick="app.export()">XUẤT FILE EXCEL</button>
            <button style="background: var(--danger)" onclick="app.clear()">XÓA HẾT DỮ LIỆU MÁY</button>
        </div>
        <div id="syncStatus" class="status-bar">Trạng thái: Sẵn sàng</div>
    </div>

    <div class="card" style="overflow-x: auto;">
        <h3>📋 DANH MỤC THIẾT BỊ</h3>
        <table>
            <thead>
                <tr>
                    <th style="width: 50px">STT</th>
                    <th>Tên thiết bị</th>
                    <th>Số Serial (S/N)</th>
                    <th>Vị trí</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="tblBody"></tbody>
        </table>
    </div>

<script>
// Dán URL Google Web App của bạn vào đây
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzOhq-bmhvxGeFz1oCaXoiJRJTpTtckexhNxSTNT4BmcuxtfEUENqHZrPNpxTD_xuXJ/exec";

const app = {
    items: JSON.parse(localStorage.getItem('cns_data_safe')) || [],

    add() {
        const name = document.getElementById('fName').value.trim();
        const sn = document.getElementById('fSN').value.trim();
        const loc = document.getElementById('fLoc').value.trim();
        
        if(!name || !sn) return alert("Vui lòng nhập Tên và S/N!");

        this.items.push({ name, sn, loc, time: new Date().toLocaleString() });
        this.save();
        this.render();
        this.resetForm();
    },

    save() {
        localStorage.setItem('cns_data_safe', JSON.stringify(this.items));
    },

    render() {
        const body = document.getElementById('tblBody');
        body.innerHTML = this.items.map((item, idx) => `
            <tr>
                <td>${idx + 1}</td>
                <td><b>${item.name}</b></td>
                <td><code>${item.sn}</code></td>
                <td>${item.loc}</td>
                <td><button onclick="app.remove(${idx})" style="background:var(--danger); padding:4px 8px; font-size:11px">Xóa</button></td>
            </tr>
        `).join('');
    },

    remove(idx) {
        if(confirm("Xóa thiết bị này?")) {
            this.items.splice(idx, 1);
            this.save();
            this.render();
        }
    },

    resetForm() {
        document.querySelectorAll('input').forEach(i => i.value = "");
    },

    clear() {
        if(confirm("Bạn có chắc chắn muốn xóa hết dữ liệu trên máy? Hành động này không thể hoàn tác trừ khi bạn đã đồng bộ Cloud.")) {
            this.items = [];
            this.save();
            this.render();
        }
    },

    // --- CHỨC NĂNG ĐỒNG BỘ ĐÃ SỬA LỖI ---
    async syncCloud() {
        if(!SCRIPT_URL.includes("macros")) return alert("Vui lòng cấu hình SCRIPT_URL!");
        
        const btn = document.getElementById('syncBtn');
        const status = document.getElementById('syncStatus');
        
        btn.disabled = true;
        btn.innerText = "ĐANG XỬ LÝ...";
        status.innerText = "Đang kết nối tới Cloud...";

        try {
            // Bước 1: Gửi dữ liệu hiện có lên Cloud (để lưu trữ)
            // Sử dụng mode: 'no-cors' cho POST để tránh lỗi bảo mật trình duyệt
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                body: JSON.stringify(this.items)
            });

            // Bước 2: Tải dữ liệu mới nhất từ Cloud về
            const response = await fetch(SCRIPT_URL);
            const cloudData = await response.json();

            // KIỂM TRA CHỐT CHẶN: Chỉ cập nhật nếu Cloud trả về dữ liệu hợp lệ
            if (cloudData && Array.isArray(cloudData) && cloudData.length > 0) {
                this.items = cloudData;
                this.save();
                this.render();
                status.innerText = "Đồng bộ thành công lúc: " + new Date().toLocaleTimeString();
                alert("✅ Đã đồng bộ thành công " + cloudData.length + " thiết bị!");
            } else {
                // Nếu Cloud rỗng, chúng ta giữ nguyên dữ liệu tại máy
                status.innerText = "Cloud hiện đang trống. Dữ liệu tại máy đã được đẩy lên Cloud.";
                alert("☁️ Đã đẩy dữ liệu lên Cloud. Cloud hiện chưa có dữ liệu cũ để tải về.");
            }
        } catch (error) {
            console.error(error);
            status.innerText = "Lỗi: Không thể kết nối. Vui lòng kiểm tra Internet hoặc Script URL.";
            alert("❌ Lỗi đồng bộ. Dữ liệu tại máy vẫn được giữ an toàn.");
        } finally {
            btn.disabled = false;
            btn.innerText = "🔄 ĐỒNG BỘ CLOUD (AN TOÀN)";
        }
    },

    export() {
        const ws = XLSX.utils.json_to_sheet(this.items);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Inventory");
        XLSX.writeFile(wb, "CNS_Inventory.xlsx");
    }
};

// Khởi tạo hiển thị
app.render();
</script>
</body>
</html>
