<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNS/ATM ASSET MANAGEMENT SYSTEM - v2026.PRO</title>
    
    <!-- Thư viện hỗ trợ Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { 
            --p: #4338ca; --bg: #f8fafc; --txt: #1e293b; 
            --danger: #ef4444; --success: #10b981; 
            --edit: #0ea5e9; --audit: #8b5cf6; --cloud: #0284c7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--txt); padding: 20px; line-height: 1.5; }
        
        /* Giao diện Đăng nhập */
        #loginOverlay { position: fixed; inset: 0; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { text-align: center; width: 380px; padding: 40px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; }

        .container { max-width: 1440px; margin: 0 auto; display: none; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        h2 { font-size: 14px; color: var(--p); text-transform: uppercase; margin-bottom: 20px; border-left: 4px solid var(--p); padding-left: 12px; letter-spacing: 0.05em; }

        /* Form Layout */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 12px; font-weight: 700; color: #64748b; }
        input, textarea, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; transition: border 0.2s; }
        input:focus { outline: none; border-color: var(--p); }
        .editing-row { background-color: #fef9c3 !important; }

        /* Nút bấm */
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: white; font-size: 13px; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Bảng dữ liệu */
        .table-wrap { overflow-x: auto; background: white; border-radius: 12px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th { background: #f8fafc; padding: 14px; font-size: 12px; color: #64748b; text-transform: uppercase; text-align: center; border-bottom: 2px solid #e2e8f0; }
        td { padding: 14px; border-bottom: 1px solid #f1f5f9; text-align: center; font-size: 14px; }
        
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; }
        .audit-ok { background: #dcfce7; color: #15803d; }
        .audit-missing { background: #fee2e2; color: #b91c1c; }
        .history-icon { cursor: help; color: #94a3b8; margin-left: 6px; }

        /* Modals */
        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(4px); }
        .modal { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); width: 450px; }

        /* --- CSS BÁO CÁO CHUYÊN NGHIỆP --- */
        @media print {
            body * { visibility: hidden; }
            #reportContent, #reportContent * { visibility: visible; }
            #reportContent { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
            .no-print { display: none !important; }
        }
        .report-container { font-family: "Times New Roman", Times, serif; padding: 40px; color: #000; display: none; background: #white; }
        .report-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; text-align: center; }
        .report-title { text-align: center; margin: 30px 0; }
        .report-title h1 { font-size: 18px; text-transform: uppercase; margin-bottom: 5px; }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        .report-table th, .report-table td { border: 1px solid black; padding: 8px; text-align: center; }
        .report-footer { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; font-weight: bold; }
        .footer-space { height: 70px; }
        .line-sig { width: 120px; border-top: 1px solid #000; margin: 5px auto; }
    </style>
</head>
<body>

<!-- Đăng nhập -->
<div id="loginOverlay">
    <div class="login-box">
        <h1 style="color:var(--p); margin-bottom:10px; font-size:22px">HỆ THỐNG QUẢN LÝ CNS/ATM</h1>
        <input type="text" id="user" placeholder="Tên đăng nhập (admin/guest)">
        <input type="password" id="pass" placeholder="Mật khẩu">
        <button onclick="checkLogin()" style="background:var(--p); width:100%; justify-content:center">ĐĂNG NHẬP HỆ THỐNG</button>
    </div>
</div>

<div class="container" id="mainApp">
    <!-- Form nhập liệu -->
    <div class="card" id="formArea">
        <h2 id="formTitle">📦 Cập nhật thông tin thiết bị</h2>
        <input type="hidden" id="editIndex" value="-1">
        <div class="form-grid">
            <div class="input-group"><label>Tên thiết bị *</label><input type="text" id="inName"></div>
            <div class="input-group"><label>P/N</label><input type="text" id="inPN"></div>
            <div class="input-group"><label>S/N *</label><input type="text" id="inSN"></div>
            <div class="input-group"><label>Mã Tài Sản</label><input type="text" id="inCode"></div>
            <div class="input-group"><label>Mã Kho *</label><input type="text" id="inWarehouse"></div>
            <div class="input-group"><label>Vị trí chi tiết</label><input type="text" id="inLoc"></div>
            <div class="input-group"><label>Số lượng</label><input type="number" id="inQty" value="1"></div>
        </div>
        <div class="btn-group">
            <button id="btnAdd" style="background:var(--p)" onclick="addItem()">➕ THÊM THIẾT BỊ</button>
            <button id="btnUpdate" style="background:var(--edit); display:none" onclick="updateItem()">💾 LƯU THAY ĐỔI</button>
            <button id="btnCancel" style="background:#94a3b8; display:none" onclick="cancelEdit()">HỦY BỎ</button>
        </div>
    </div>

    <!-- Nghiệp vụ & Báo cáo -->
    <div class="card">
        <h2>🛠 Nghiệp vụ & Báo cáo chuyên dụng</h2>
        <div style="display:flex; gap:16px; margin-bottom:20px">
            <input type="text" id="searchBox" oninput="render()" placeholder="🔍 Tìm nhanh S/N, Part Number hoặc Mã kho..." style="flex:1; padding:14px">
            <button id="btnCloudSync" onclick="syncToCloud()" style="background:var(--cloud)">☁️ ĐỒNG BỘ CLOUD</button>
        </div>
        <div class="btn-group">
            <button onclick="generateStockReport()" style="background:#1e293b">📦 BÁO CÁO TỒN KHO</button>
            <button onclick="generateAuditReport()" style="background:var(--audit)">📋 BÁO CÁO KIỂM KÊ</button>
            <button onclick="exportToExcel()" style="background:#16a34a">📊 XUẤT FILE EXCEL</button>
            <button onclick="openAuditModal()" style="background:var(--audit)">📝 KIỂM KÊ NHANH</button>
            
            <div id="adminBackupGroup" style="display:none; gap:10px;">
                <button onclick="createBackup()" style="background:var(--success)">💾 SNAPSHOT</button>
                <button onclick="openBackupModal()" style="background:var(--cloud)">📂 PHIÊN BẢN</button>
            </div>
            <button onclick="location.reload()" style="background:var(--danger); margin-left:auto">🚪 ĐĂNG XUẤT</button>
        </div>
        <div id="syncStatus" style="font-size:11px; color:#64748b; margin-top:10px">Trạng thái đồng bộ: Chưa thực hiện</div>
    </div>

    <!-- Bảng chính -->
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th width="50">STT</th>
                    <th>Tên thiết bị</th>
                    <th>P/N</th>
                    <th>Serial Number</th>
                    <th>Kho / Vị trí</th>
                    <th>Trạng thái</th>
                    <th width="150">Thao tác</th>
                </tr>
            </thead>
            <tbody id="mainTable"></tbody>
        </table>
    </div>
</div>

<!-- Modal Kiểm kê -->
<div id="auditOverlay" class="overlay">
    <div class="modal">
        <h3>📋 KIỂM KÊ HIỆN TRƯỜNG</h3>
        <div class="input-group" style="margin:15px 0">
            <label>Mã kho cần kiểm</label><input type="text" id="auditWh">
            <label>S/N (Quét barcode)</label><input type="text" id="auditSn">
            <label>Ghi chú thực tế</label><textarea id="auditNote" rows="2"></textarea>
        </div>
        <div style="display:flex; gap:20px; margin-bottom:15px">
            <label><input type="radio" name="aStatus" value="OK" checked> TỒN TẠI</label>
            <label style="color:var(--danger)"><input type="radio" name="aStatus" value="MISSING"> THIẾU HỤT</label>
        </div>
        <div class="btn-group">
            <button onclick="processAudit()" style="flex:1; background:var(--p)">XÁC NHẬN</button>
            <button onclick="closeAuditModal()" style="background:#94a3b8">ĐÓNG</button>
        </div>
    </div>
</div>

<!-- Modal Backup -->
<div id="backupOverlay" class="overlay">
    <div class="modal" style="width:600px">
        <h3>📂 PHIÊN BẢN SAO LƯU HỆ THỐNG</h3>
        <div id="backupListContent" style="max-height:300px; overflow-y:auto; margin:15px 0; border:1px solid #eee"></div>
        <button onclick="closeBackupModal()" style="background:#94a3b8; width:100%">ĐÓNG</button>
    </div>
</div>

<!-- Container Ẩn cho Báo cáo (Chỉ hiện khi In) -->
<div id="reportContainer" class="report-container"></div>

<script>
    const STORAGE_KEY = "cns_data_v26_final";
    const BACKUP_KEY = "cns_backup_versions";
    const CLOUD_URL = "https://script.google.com/macros/s/AKfycbzOhq-bmhvxGeFz1oCaXoiJRJTpTtckexhNxSTNT4BmcuxtfEUENqHZrPNpxTD_xuXJ/exec"; 

    let inventory = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentRole = 'guest';

    // 1. QUẢN LÝ ĐĂNG NHẬP
    function checkLogin() {
        const u = document.getElementById('user').value.toLowerCase();
        const p = document.getElementById('pass').value;
        if ((u === 'admin' && p === 'admin') || (u === 'guest' && p === '123456')) {
            currentRole = u;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            if (currentRole === 'admin') document.getElementById('adminBackupGroup').style.display = 'flex';
            else document.getElementById('formArea').style.display = 'none';
            render();
        } else alert("Sai thông tin đăng nhập!");
    }

    // 2. NGHIỆP VỤ CRUD
    function addItem() {
        const name = document.getElementById('inName').value.trim();
        const sn = document.getElementById('inSN').value.trim();
        const wh = document.getElementById('inWarehouse').value.trim();
        if (!name || !sn || !wh) return alert("Vui lòng nhập các trường bắt buộc (*)");

        inventory.push({
            name, sn, warehouse: wh,
            pn: document.getElementById('inPN').value.trim(),
            code: document.getElementById('inCode').value.trim(),
            loc: document.getElementById('inLoc').value.trim(),
            qty: document.getElementById('inQty').value,
            auditStatus: null, editHistory: []
        });
        save(); clearForm();
    }

    function editItem(idx) {
        const item = inventory[idx];
        document.getElementById('editIndex').value = idx;
        document.getElementById('inName').value = item.name;
        document.getElementById('inSN').value = item.sn;
        document.getElementById('inWarehouse').value = item.warehouse;
        document.getElementById('inPN').value = item.pn || '';
        document.getElementById('inCode').value = item.code || '';
        document.getElementById('inLoc').value = item.loc || '';
        document.getElementById('inQty').value = item.qty || 1;

        document.getElementById('btnAdd').style.display = 'none';
        document.getElementById('btnUpdate').style.display = 'inline-flex';
        document.getElementById('btnCancel').style.display = 'inline-flex';
        window.scrollTo({top: 0, behavior: 'smooth'});
        render();
    }

    function updateItem() {
        const idx = parseInt(document.getElementById('editIndex').value);
        if (!inventory[idx].editHistory) inventory[idx].editHistory = [];
        inventory[idx].editHistory.push({ time: new Date().toLocaleString(), user: currentRole });

        inventory[idx] = { ...inventory[idx], 
            name: document.getElementById('inName').value,
            sn: document.getElementById('inSN').value,
            pn: document.getElementById('inPN').value,
            code: document.getElementById('inCode').value,
            warehouse: document.getElementById('inWarehouse').value,
            loc: document.getElementById('inLoc').value,
            qty: document.getElementById('inQty').value
        };
        save(); cancelEdit();
    }

    function cancelEdit() {
        document.getElementById('editIndex').value = "-1";
        document.getElementById('btnAdd').style.display = 'inline-flex';
        document.getElementById('btnUpdate').style.display = 'none';
        document.getElementById('btnCancel').style.display = 'none';
        clearForm(); render();
    }

    // 3. ĐỒNG BỘ CLOUD (GOOGLE SHEETS)
    async function syncToCloud() {
        const btn = document.getElementById('btnCloudSync');
        const st = document.getElementById('syncStatus');
        btn.disabled = true; st.innerText = "⏳ Đang kết nối...";
        try {
            await fetch(CLOUD_URL, {
                method: "POST", mode: "no-cors",
                body: JSON.stringify(inventory)
            });
            st.innerText = "✅ Đồng bộ thành công: " + new Date().toLocaleString();
            alert("Đã cập nhật dữ liệu lên Google Sheets!");
        } catch (e) {
            st.innerText = "❌ Lỗi kết nối!";
        } finally { btn.disabled = false; }
    }

    // 4. KIỂM KÊ NHANH
    function openAuditModal() { document.getElementById('auditOverlay').style.display = 'flex'; }
    function closeAuditModal() { document.getElementById('auditOverlay').style.display = 'none'; }
    function processAudit() {
        const wh = document.getElementById('auditWh').value.trim();
        const sn = document.getElementById('auditSn').value.trim();
        const status = document.querySelector('input[name="aStatus"]:checked').value;
        const note = document.getElementById('auditNote').value.trim();

        let count = 0;
        inventory = inventory.map(item => {
            if (item.warehouse === wh && (!sn || item.sn === sn)) {
                count++;
                return { ...item, auditStatus: status, auditDate: new Date().toLocaleDateString('vi-VN'), auditNote: note };
            }
            return item;
        });
        save(); closeAuditModal();
        alert(`Đã cập nhật kiểm kê cho ${count} thiết bị.`);
    }

    // 5. BACKUP SNAPSHOT
    function createBackup() {
        let bks = JSON.parse(localStorage.getItem(BACKUP_KEY)) || [];
        bks.unshift({ id: Date.now(), time: new Date().toLocaleString(), data: [...inventory] });
        localStorage.setItem(BACKUP_KEY, JSON.stringify(bks.slice(0, 10)));
        alert("Đã tạo bản sao lưu Snapshot!");
    }
    function openBackupModal() {
        document.getElementById('backupOverlay').style.display = 'flex';
        const list = document.getElementById('backupListContent');
        const bks = JSON.parse(localStorage.getItem(BACKUP_KEY)) || [];
        list.innerHTML = bks.map(b => `<div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between">
            <span>${b.time} (${b.data.length} TB)</span>
            <button onclick="restoreBackup(${b.id})" style="background:var(--danger); padding:4px 8px">Restore</button>
        </div>`).join('');
    }
    function restoreBackup(id) {
        if (!confirm("Ghi đè dữ liệu hiện tại bằng bản sao lưu này?")) return;
        const bks = JSON.parse(localStorage.getItem(BACKUP_KEY)) || [];
        const target = bks.find(b => b.id === id);
        if (target) { inventory = [...target.data]; save(); closeBackupModal(); }
    }
    function closeBackupModal() { document.getElementById('backupOverlay').style.display = 'none'; }

    // 6. --- MODULE BÁO CÁO CHUYÊN NGHIỆP ---
    function generateStockReport() {
        const container = document.getElementById('reportContainer');
        const totalQty = inventory.reduce((acc, i) => acc + parseInt(i.qty || 0), 0);
        const totalTypes = new Set(inventory.map(i => i.name)).size;

        container.innerHTML = `
            <div id="reportContent">
                <div class="no-print" style="text-align:right; margin-bottom:20px">
                    <button onclick="window.print()" style="background:var(--p)">🖨️ IN BÁO CÁO / LƯU PDF</button>
                    <button onclick="hideReport()" style="background:#64748b">ĐÓNG</button>
                </div>
                <div class="report-header">
                    <div>CÔNG TY QUẢN LÝ BAY MIỀN NAM<br>TRUNG TÂM BẢO ĐẢM KỸ THUẬT<br>ĐỘI THÔNG TIN<div class="line-sig" style="width:60px"></div></div>
                    <div>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<br>Độc lập - Tự do - Hạnh phúc<div class="line-sig"></div></div>
                </div>
                <div class="report-title">
                    <h1>BÁO CÁO TỒN KHO VẬT TƯ DỰ PHÒNG TẠI CHỖ</h1>
                    <p>Ngày trích xuất: ${new Date().toLocaleString('vi-VN')}</p>
                </div>
                <p><b>Người lập:</b> ${currentRole.toUpperCase()} | <b>Tổng số thiết bị:</b> ${totalQty} | <b>Tổng số chủng loại:</b> ${totalTypes}</p>
                <table class="report-table">
                    <thead>
                        <tr><th>STT</th><th>Tên thiết bị</th><th>P/N</th><th>S/N</th><th>Mã TS</th><th>Mã Kho</th><th>SL</th><th>Vị trí</th></tr>
                    </thead>
                    <tbody>
                        ${inventory.map((i, idx) => `<tr><td>${idx+1}</td><td style="text-align:left">${i.name}</td><td>${i.pn||'-'}</td><td>${i.sn}</td><td>${i.code||'-'}</td><td>${i.warehouse}</td><td>${i.qty}</td><td>${i.loc||'-'}</td></tr>`).join('')}
                    </tbody>
                </table>
                <div class="report-footer">
                    <div>NGƯỜI LẬP BIỂU<div class="footer-space"></div>${currentRole.toUpperCase()}</div>
                    <div>ĐỘI TRƯỞNG<div class="footer-space"></div>........................</div>
                    <div>GHI CHÚ<div class="footer-space"></div>........................</div>
                </div>
            </div>
        `;
        container.style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }

    function generateAuditReport() {
        const container = document.getElementById('reportContainer');
        const audited = inventory.filter(i => i.auditStatus);
        const stats = { ok: audited.filter(i => i.auditStatus === 'OK').length, miss: audited.filter(i => i.auditStatus === 'MISSING').length };

        container.innerHTML = `
            <div id="reportContent">
                <div class="no-print" style="text-align:right; margin-bottom:20px">
                    <button onclick="window.print()" style="background:var(--p)">🖨️ IN BIÊN BẢN / PDF</button>
                    <button onclick="hideReport()" style="background:#64748b">ĐÓNG</button>
                </div>
                <div class="report-header">
                    <div>CÔNG TY QUẢN LÝ BAY MIỀN NAM<br>TRUNG TÂM BẢO ĐẢM KỸ THUẬT<br>ĐỘI THÔNG TIN</div>
                    <div>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<br>Độc lập - Tự do - Hạnh phúc</div>
                </div>
                <div class="report-title">
                    <h1>BIÊN BẢN KIỂM KÊ VẬT TƯ DỰ PHÒNG TẠI CHỖ</h1>
                </div>
                <p><b>Ngày kiểm kê:</b> ${new Date().toLocaleDateString('vi-VN')} | <b>Người kiểm:</b> ${currentRole.toUpperCase()}</p>
                <table class="report-table">
                    <thead>
                        <tr><th>STT</th><th>Tên thiết bị</th><th>P/N</th><th>S/N</th><th>Mã Kho</th><th>Trạng thái</th><th>Ngày kiểm</th><th>Ghi chú</th></tr>
                    </thead>
                    <tbody>
                        ${inventory.map((i, idx) => `<tr><td>${idx+1}</td><td style="text-align:left">${i.name}</td><td>${i.pn||'-'}</td><td>${i.sn}</td><td>${i.warehouse}</td><td>${i.auditStatus||'NOT CHECKED'}</td><td>${i.auditDate||'-'}</td><td>${i.auditNote||''}</td></tr>`).join('')}
                    </tbody>
                </table>
                <div style="margin-top:15px; border:1px solid #000; padding:10px">
                    <b>TỔNG HỢP:</b> Tổng thiết bị: ${inventory.length} | Tồn tại (OK): ${stats.ok} | Thiếu hụt (MISSING): ${stats.miss} | Chưa kiểm: ${inventory.length - audited.length}
                </div>
                <div class="report-footer">
                    <div>NGƯỜI KIỂM KÊ<div class="footer-space"></div>${currentRole.toUpperCase()}</div>
                    <div>NGƯỜI GIÁM SÁT<div class="footer-space"></div>........................</div>
                    <div>ĐỘI TRƯỞNG<div class="footer-space"></div>........................</div>
                </div>
            </div>
        `;
        container.style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }

    function hideReport() { document.getElementById('reportContainer').style.display = 'none'; }

    // 7. RENDER & STORAGE
    function render() {
        const tbody = document.getElementById('mainTable');
        const s = document.getElementById('searchBox').value.toLowerCase();
        const eIdx = document.getElementById('editIndex').value;
        tbody.innerHTML = '';
        inventory.forEach((item, idx) => {
            if (item.name.toLowerCase().includes(s) || item.sn.toLowerCase().includes(s) || item.warehouse.toLowerCase().includes(s)) {
                let badge = item.auditStatus ? `<span class="badge ${item.auditStatus === 'OK' ? 'audit-ok' : 'audit-missing'}">${item.auditStatus}</span>` : '-';
                let hist = item.editHistory?.length > 0 ? `<span class="history-icon" title="Đã sửa ${item.editHistory.length} lần">📜</span>` : '';
                tbody.innerHTML += `
                    <tr class="${eIdx == idx ? 'editing-row' : ''}">
                        <td>${idx + 1}</td>
                        <td style="text-align:left; font-weight:600">${item.name} ${hist}</td>
                        <td style="color:#64748b">${item.pn || '-'}</td>
                        <td style="font-family:monospace; color:var(--p)">${item.sn}</td>
                        <td>${item.warehouse} / ${item.loc || '-'}</td>
                        <td>${badge}</td>
                        <td>
                            <button onclick="editItem(${idx})" style="background:var(--edit); padding:6px 12px">Sửa</button>
                            <button onclick="deleteItem(${idx})" style="background:var(--danger); padding:6px 12px">Xóa</button>
                        </td>
                    </tr>`;
            }
        });
    }

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory)); render(); }
    function clearForm() { document.querySelectorAll('.form-grid input').forEach(i => i.value = i.id==='inQty'?'1':''); }
    function deleteItem(idx) { if(confirm("Xóa thiết bị này?")) { inventory.splice(idx,1); save(); } }
    
    function exportToExcel() {
        const ws = XLSX.utils.json_to_sheet(inventory.map(({editHistory, ...rest}) => rest));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Assets");
        XLSX.writeFile(wb, "CNS_ATM_Assets_2026.xlsx");
    }
</script>
</body>
</html>
