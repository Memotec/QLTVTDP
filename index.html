<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ THIẾT BỊ CNS/ATM - ĐỘI THÔNG TIN</title>
    
    <script src="https://cdn.jsdelivr.net/npm/kjua@0.9.0/dist/kjua.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --p: #4338ca; --bg: #f1f5f9; --txt: #1e293b; --edit: #0ea5e9; --danger: #ef4444; --success: #10b981; --excel: #1d6f42; --report: #6366f1; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--txt); padding: 15px; }
        
        #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); text-align: center; width: 400px; border: 1px solid #e2e8f0; }
        .login-box input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1.5px solid #e2e8f0; border-radius: 10px; outline: none; }

        .container { max-width: 1400px; margin: 0 auto; display: none; }
        .card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .section-title { font-size: 14px; font-weight: 700; color: var(--p); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .full { grid-column: span 4; }
        .half { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 12px; font-weight: 600; color: #64748b; }
        .input-group input { padding: 12px 15px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 14px; background: #f8fafc; }

        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        button { padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; color: white; font-size: 14px; display: flex; align-items: center; gap: 8px; justify-content: center; transition: 0.2s; }
        button:hover { opacity: 0.85; transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        input#searchInput { width: 100%; padding: 16px 20px; border-radius: 12px; border: 2px solid #e2e8f0; margin-bottom: 20px; font-size: 16px; transition: 0.3s; }
        
        .table-wrap { overflow-x: auto; background: white; border-radius: 12px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: #f8fafc; padding: 16px; font-size: 11px; font-weight: 800; color: #475569; border-bottom: 2px solid #e2e8f0; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; text-align: center; font-size: 14px; color: #1e293b; }
        
        .name-col { text-align: left !important; font-weight: 600; color: #0f172a; }
        .badge-warehouse { background: #e0e7ff; color: #4338ca; padding: 4px 8px; border-radius: 6px; font-weight: 700; }

        #auditModal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 10000; backdrop-filter: blur(4px); }
        .audit-box { background: white; width: 450px; padding: 25px; border-radius: 16px; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h1 style="color: var(--p); margin-bottom: 5px; font-size: 24px;">CNS/ATM SYSTEM</h1>
        <p style="font-size: 12px; margin-bottom: 30px; color:#64748b;">ĐỘI THÔNG TIN - TT BĐKT HCM</p>
        <input type="text" id="user" placeholder="Tên đăng nhập">
        <input type="password" id="pass" placeholder="Mật khẩu">
        <button onclick="checkLogin()" style="background:var(--p); width:100%;">ĐĂNG NHẬP</button>
    </div>
</div>

<div class="container no-print" id="mainApp">
    <div class="card" id="adminArea" style="display:none;">
        <div class="section-title">📦 Cập nhật thông tin thiết bị</div>
        <div class="form-grid">
            <input type="hidden" id="editIndex" value="-1">
            <div class="full input-group"><label>Tên thiết bị / Model</label><input type="text" id="inName"></div>
            <div class="input-group"><label>Part Number (P/N)</label><input type="text" id="inPN"></div>
            <div class="input-group"><label>Serial Number (S/N)</label><input type="text" id="inSN"></div>
            <div class="input-group"><label>Mã Tài Sản (CCDC)</label><input type="text" id="inCode"></div>
            <div class="input-group"><label>Mã Kho</label><input type="text" id="inWarehouse"></div>
            <div class="half input-group"><label>Vị trí lắp đặt</label><input type="text" id="inLoc"></div>
            <div class="half input-group"><label>Số lượng</label><input type="number" id="inQty" value="1"></div>
        </div>
        <div class="btn-group">
            <button id="btnAdd" style="background:var(--p); min-width: 150px;" onclick="addItem()">➕ Thêm mới</button>
            <button id="btnUpdate" style="background:var(--edit); min-width: 150px; display:none;" onclick="updateItem()">💾 Lưu thay đổi</button>
            <button style="background:#94a3b8" onclick="clearForm()">Làm mới</button>
        </div>
    </div>

    <div class="card">
        <div class="section-title">🔍 Tra cứu & Đồng bộ Cloud</div>
        <input type="text" id="searchInput" oninput="render()" placeholder="Tìm kiếm nhanh thiết bị, số serial, mã tài sản...">
        <div class="btn-group">
            <button id="btnSync" style="background:var(--success)" onclick="syncCloud()">🔄 Đồng bộ Cloud</button>
            <button style="background:var(--excel)" onclick="exportToExcel()">📊 Xuất File Excel</button>
            <button style="background:var(--danger); margin-left: auto;" onclick="location.reload()">Thoát</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">STT</th>
                    <th style="text-align:left">Tên thiết bị</th>
                    <th>P/N</th>
                    <th>S/N</th>
                    <th>Mã TS</th>
                    <th>Kho</th>
                    <th>SL</th>
                    <th>Vị trí</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
        </table>
    </div>
</div>

<script>
    // URL Web App sau khi anh Deploy bản mới nhất từ Code.gs
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzt9D1lgfdSnLnOqa9i0MPnLNPmhhPiq9QpeKwMQ0TwnDVD0Sw6A1eqDthgn2n0-9lT/exec"; 
    
    let inventory = JSON.parse(localStorage.getItem('cns_data_v26_final')) || [];
    let role = null;

    function checkLogin() {
        const u = document.getElementById('user').value.toLowerCase().trim();
        const p = document.getElementById('pass').value;
        if ((u === 'admin' && p === 'admin') || (u === 'guest' && p === '123456')) {
            role = u;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            if(role === 'admin') document.getElementById('adminArea').style.display = 'block';
            render();
            loadFromCloud(); // Tự động lấy dữ liệu mới nhất khi đăng nhập
        } else alert("Sai thông tin đăng nhập!");
    }

    async function loadFromCloud() {
        try {
            const response = await fetch(WEB_APP_URL);
            const data = await response.json();
            if (data && data.length > 0) {
                inventory = data;
                save();
            }
        } catch (e) { console.log("Offline mode hoặc lỗi tải Cloud"); }
    }

    function render() {
        const tbody = document.getElementById('inventoryBody');
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        tbody.innerHTML = '';

        inventory.forEach((item, idx) => {
            const match = Object.values(item).some(val => String(val).toLowerCase().includes(q));
            if (match) {
                tbody.innerHTML += `<tr>
                    <td>${idx+1}</td>
                    <td class="name-col">${item.name}</td>
                    <td>${item.pn}</td>
                    <td style="font-weight: 600;">${item.sn}</td>
                    <td>${item.code || '-'}</td>
                    <td><span class="badge-warehouse">${item.warehouse || '-'}</span></td>
                    <td><b>${item.qty}</b></td>
                    <td>${item.loc}</td>
                    <td>
                        <button style="background:var(--edit); padding: 5px 10px;" onclick="editItem(${idx})">Sửa</button>
                        <button style="background:var(--danger); padding: 5px 10px;" onclick="deleteItem(${idx})">Xóa</button>
                    </td>
                </tr>`;
            }
        });
    }

    async function syncCloud() {
        if (inventory.length === 0) return alert("Không có dữ liệu để đồng bộ!");
        const btn = document.getElementById('btnSync');
        const originalText = btn.innerText;
        
        try {
            btn.innerText = "⏳ Đang gửi...";
            btn.disabled = true;

            const params = new URLSearchParams();
            params.append('data', JSON.stringify(inventory));

            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: params
            });

            alert("✅ Đồng bộ thành công lên Google Sheets!");
        } catch (error) {
            alert("❌ Lỗi kết nối!");
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }

    function addItem() {
        const name = document.getElementById('inName').value.trim();
        const sn = document.getElementById('inSN').value.trim();
        if (!name || !sn) return alert("Vui lòng nhập Tên và Serial Number!");
        
        inventory.push({
            name, sn, 
            pn: document.getElementById('inPN').value.trim(),
            code: document.getElementById('inCode').value.trim(),
            warehouse: document.getElementById('inWarehouse').value.trim(),
            qty: document.getElementById('inQty').value,
            loc: document.getElementById('inLoc').value.trim()
        });
        save(); clearForm();
    }

    function editItem(idx) {
        if(role !== 'admin') return alert("Chỉ Admin mới có quyền sửa!");
        const item = inventory[idx];
        document.getElementById('editIndex').value = idx;
        document.getElementById('inName').value = item.name;
        document.getElementById('inPN').value = item.pn;
        document.getElementById('inSN').value = item.sn;
        document.getElementById('inCode').value = item.code;
        document.getElementById('inWarehouse').value = item.warehouse;
        document.getElementById('inQty').value = item.qty;
        document.getElementById('inLoc').value = item.loc;
        document.getElementById('btnAdd').style.display = 'none';
        document.getElementById('btnUpdate').style.display = 'block';
        window.scrollTo(0,0);
    }

    function updateItem() {
        const idx = document.getElementById('editIndex').value;
        inventory[idx] = {
            name: document.getElementById('inName').value,
            pn: document.getElementById('inPN').value,
            sn: document.getElementById('inSN').value,
            code: document.getElementById('inCode').value,
            warehouse: document.getElementById('inWarehouse').value,
            qty: document.getElementById('inQty').value,
            loc: document.getElementById('inLoc').value
        };
        save(); clearForm();
    }

    function deleteItem(idx) {
        if(confirm("Xác nhận xóa thiết bị này?")) {
            inventory.splice(idx, 1);
            save();
        }
    }

    function save() {
        localStorage.setItem('cns_data_v26_final', JSON.stringify(inventory));
        render();
    }

    function clearForm() { 
        document.querySelectorAll('.form-grid input').forEach(i => i.value = i.id==='inQty'?'1':''); 
        document.getElementById('btnAdd').style.display='block'; 
        document.getElementById('btnUpdate').style.display='none'; 
    }

    function exportToExcel() {
        const ws = XLSX.utils.json_to_sheet(inventory);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Inventory");
        XLSX.writeFile(wb, "ThongKe_VTDP_CNS_ATM.xlsx");
    }
</script>
</body>
</html>
