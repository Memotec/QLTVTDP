<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNS/ATM REAL-TIME ASSET MANAGEMENT v2.0</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { 
            --p: #4338ca; --bg: #f8fafc; --txt: #1e293b; 
            --danger: #ef4444; --success: #10b981; 
            --edit: #0ea5e9; --audit: #8b5cf6; --cloud: #0284c7;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--txt); padding: 20px; line-height: 1.5; padding-bottom: 80px; }
        
        /* Login */
        #loginOverlay { position: fixed; inset: 0; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { text-align: center; width: 380px; padding: 40px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; }

        .container { max-width: 1440px; margin: 0 auto; display: none; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        h2 { font-size: 13px; color: var(--p); text-transform: uppercase; margin-bottom: 20px; border-left: 4px solid var(--p); padding-left: 12px; letter-spacing: 0.05em; }

        /* Real-time Indicator */
        #realtimeStatus { position: fixed; bottom: 20px; right: 20px; z-index: 10000; padding: 10px 18px; border-radius: 30px; background: #fff; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 10px; border: 1px solid #e2e8f0; }
        #statusDot { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; transition: 0.3s; }
        .pulse { animation: pulse-animation 1.5s infinite; }
        @keyframes pulse-animation { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Form & Tables */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 11px; font-weight: 700; color: #64748b; }
        input, textarea, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: white; font-size: 13px; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .table-wrap { overflow-x: auto; background: white; border-radius: 12px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th { background: #f8fafc; padding: 14px; font-size: 11px; color: #64748b; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; text-align: center; }
        td { padding: 14px; border-bottom: 1px solid #f1f5f9; text-align: center; font-size: 14px; }
        
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; }
        .audit-ok { background: #dcfce7; color: #15803d; }
        .audit-missing { background: #fee2e2; color: #b91c1c; }

        /* Modals & Reports */
        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(4px); }
        .modal { background: white; border-radius: 16px; padding: 28px; width: 450px; }
        .report-container { font-family: "Times New Roman", Times, serif; padding: 40px; background: white; display: none; }
        @media print { body * { visibility: hidden; } #reportContent, #reportContent * { visibility: visible; } #reportContent { position: absolute; left: 0; top: 0; width: 100%; } .no-print { display: none !important; } }
    </style>
</head>
<body>

<!-- REAL-TIME INDICATOR UI -->
<div id="realtimeStatus">
    <span id="statusDot"></span>
    <span id="statusText">Đang khởi tạo...</span>
</div>

<!-- LOGIN -->
<div id="loginOverlay">
    <div class="login-box">
        <h1 style="color:var(--p); margin-bottom:10px; font-size:22px">HỆ THỐNG CNS/ATM v2.0</h1>
        <p style="font-size: 12px; color: #64748b; margin-bottom: 20px;">Real-time Cloud Synchronization</p>
        <input type="text" id="user" placeholder="User (admin/guest)">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="checkLogin()" style="background:var(--p); width:100%; justify-content:center">ĐĂNG NHẬP</button>
    </div>
</div>

<div class="container" id="mainApp">
    <!-- FORM NHẬP -->
    <div class="card" id="formArea">
        <h2 id="formTitle">📦 Cập nhật thiết bị</h2>
        <input type="hidden" id="editIndex" value="-1">
        <div class="form-grid">
            <div class="input-group"><label>Tên thiết bị *</label><input type="text" id="inName"></div>
            <div class="input-group"><label>P/N</label><input type="text" id="inPN"></div>
            <div class="input-group"><label>S/N *</label><input type="text" id="inSN"></div>
            <div class="input-group"><label>Mã Kho *</label><input type="text" id="inWarehouse"></div>
            <div class="input-group"><label>Vị trí</label><input type="text" id="inLoc"></div>
            <div class="input-group"><label>Số lượng</label><input type="number" id="inQty" value="1"></div>
        </div>
        <div class="btn-group">
            <button id="btnAdd" style="background:var(--p)" onclick="addItem()">➕ THÊM MỚI</button>
            <button id="btnUpdate" style="background:var(--edit); display:none" onclick="updateItem()">💾 LƯU THAY ĐỔI</button>
            <button id="btnCancel" style="background:#94a3b8; display:none" onclick="cancelEdit()">HỦY</button>
        </div>
    </div>

    <!-- NGHIỆP VỤ -->
    <div class="card">
        <h2>🛠 Nghiệp vụ hệ thống</h2>
        <div style="display:flex; gap:16px; margin-bottom:20px">
            <input type="text" id="searchBox" oninput="render()" placeholder="🔍 Tìm kiếm S/N, Mã kho, Tên thiết bị..." style="flex:1; padding:12px">
        </div>
        <div class="btn-group">
            <button onclick="generateStockReport()" style="background:#1e293b">📦 BÁO CÁO TỒN KHO</button>
            <button onclick="generateAuditReport()" style="background:var(--audit)">📋 BÁO CÁO KIỂM KÊ</button>
            <button onclick="exportToExcel()" style="background:#16a34a">📊 EXCEL</button>
            <button onclick="openAuditModal()" style="background:var(--audit)">📝 KIỂM KÊ NHANH</button>
            <button onclick="location.reload()" style="background:var(--danger); margin-left:auto">🚪 ĐĂNG XUẤT</button>
        </div>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th width="50">STT</th>
                    <th>Tên thiết bị</th>
                    <th>P/N</th>
                    <th>Serial Number</th>
                    <th>Kho / Vị trí</th>
                    <th>Trạng thái</th>
                    <th width="150">Thao tác</th>
                </tr>
            </thead>
            <tbody id="mainTable"></tbody>
        </table>
    </div>
</div>

<!-- AUDIT MODAL -->
<div id="auditOverlay" class="overlay">
    <div class="modal">
        <h3>📋 KIỂM KÊ HIỆN TRƯỜNG</h3>
        <div class="input-group" style="margin:15px 0">
            <label>Mã kho</label><input type="text" id="auditWh">
            <label>S/N (Quét barcode)</label><input type="text" id="auditSn">
        </div>
        <div style="display:flex; gap:20px; margin-bottom:15px">
            <label><input type="radio" name="aStatus" value="OK" checked> TỒN TẠI</label>
            <label style="color:var(--danger)"><input type="radio" name="aStatus" value="MISSING"> THIẾU HỤT</label>
        </div>
        <div class="btn-group">
            <button onclick="processAudit()" style="flex:1; background:var(--p)">XÁC NHẬN</button>
            <button onclick="closeAuditModal()" style="background:#94a3b8">ĐÓNG</button>
        </div>
    </div>
</div>

<div id="reportContainer" class="report-container"></div>

<script>
    // --- CẤU HÌNH HỆ THỐNG ---
    const STORAGE_KEY = "cns_data_v26_final";
    const TS_KEY = "cns_last_updated";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzOhq-bmhvxGeFz1oCaXoiJRJTpTtckexhNxSTNT4BmcuxtfEUENqHZrPNpxTD_xuXJ/exec"; // THAY URL CỦA BẠN VÀO ĐÂY

    let inventory = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentRole = 'guest';
    let lastLocalUpdate = localStorage.getItem(TS_KEY) || 0;
    let syncTimer = null;
    let isPushing = false;

    // 1. QUẢN LÝ ĐĂNG NHẬP
    function checkLogin() {
        const u = document.getElementById('user').value.toLowerCase();
        const p = document.getElementById('pass').value;
        if ((u === 'admin' && p === 'admin') || (u === 'guest' && p === '123456')) {
            currentRole = u;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            if (currentRole !== 'admin') document.getElementById('formArea').style.display = 'none';
            render();
            startRealtimeEngine();
        } else alert("Sai thông tin!");
    }

    // 2. CORE LOGIC (ADD, EDIT, DELETE, AUDIT)
    function addItem() {
        const name = document.getElementById('inName').value.trim();
        const sn = document.getElementById('inSN').value.trim();
        const wh = document.getElementById('inWarehouse').value.trim();
        if (!name || !sn || !wh) return alert("Thiếu thông tin bắt buộc!");

        inventory.push({
            name, sn, warehouse: wh,
            pn: document.getElementById('inPN').value.trim(),
            loc: document.getElementById('inLoc').value.trim(),
            qty: document.getElementById('inQty').value,
            auditStatus: null,
            ts: Date.now()
        });
        save(); clearForm();
    }

    function editItem(idx) {
        const item = inventory[idx];
        document.getElementById('editIndex').value = idx;
        document.getElementById('inName').value = item.name;
        document.getElementById('inSN').value = item.sn;
        document.getElementById('inWarehouse').value = item.warehouse;
        document.getElementById('inPN').value = item.pn || '';
        document.getElementById('inLoc').value = item.loc || '';
        document.getElementById('inQty').value = item.qty || 1;
        document.getElementById('btnAdd').style.display = 'none';
        document.getElementById('btnUpdate').style.display = 'inline-flex';
        document.getElementById('btnCancel').style.display = 'inline-flex';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function updateItem() {
        const idx = parseInt(document.getElementById('editIndex').value);
        inventory[idx] = { ...inventory[idx], 
            name: document.getElementById('inName').value,
            sn: document.getElementById('inSN').value,
            pn: document.getElementById('inPN').value,
            warehouse: document.getElementById('inWarehouse').value,
            loc: document.getElementById('inLoc').value,
            qty: document.getElementById('inQty').value,
            ts: Date.now()
        };
        save(); cancelEdit();
    }

    function deleteItem(idx) { if(confirm("Xóa thiết bị này?")) { inventory.splice(idx,1); save(); } }

    function processAudit() {
        const wh = document.getElementById('auditWh').value.trim();
        const sn = document.getElementById('auditSn').value.trim();
        const status = document.querySelector('input[name="aStatus"]:checked').value;
        inventory = inventory.map(item => {
            if (item.warehouse === wh && (!sn || item.sn === sn)) {
                return { ...item, auditStatus: status, auditDate: new Date().toLocaleDateString('vi-VN'), ts: Date.now() };
            }
            return item;
        });
        save(); closeAuditModal();
    }

    // 3. HỆ THỐNG REAL-TIME SYNC ENGINE (PREMIUM)
    function updateSyncUI(state, msg) {
        const dot = document.getElementById('statusDot');
        const txt = document.getElementById('statusText');
        dot.className = "";
        if (state === 'online') { dot.style.background = "var(--success)"; txt.innerText = msg || "Đã kết nối"; }
        if (state === 'syncing') { dot.style.background = "var(--warning)"; txt.innerText = "Đang đồng bộ..."; dot.classList.add('pulse'); }
        if (state === 'offline') { dot.style.background = "var(--danger)"; txt.innerText = "Mất kết nối"; }
    }

    function save() {
        lastLocalUpdate = Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
        localStorage.setItem(TS_KEY, lastLocalUpdate);
        render();
        triggerPush(); // Real-time push
    }

    function triggerPush() {
        if (syncTimer) clearTimeout(syncTimer);
        updateSyncUI('syncing');
        syncTimer = setTimeout(async () => {
            if (isPushing) return;
            isPushing = true;
            try {
                // Sử dụng phương thức gửi beacon hoặc fetch với mode no-cors cho Google Apps Script
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: "push", data: inventory, lastUpdated: lastLocalUpdate })
                });
                updateSyncUI('online', 'Đã lưu Cloud');
            } catch (e) {
                updateSyncUI('offline');
            } finally { isPushing = false; }
        }, 2000); // Debounce 2s
    }

    async function pullCloud() {
        if (isPushing || document.hidden) return;
        try {
            const res = await fetch(`${WEB_APP_URL}?action=pull&_=${Date.now()}`);
            const cloud = await res.json();
            if (cloud && cloud.lastUpdated > lastLocalUpdate) {
                inventory = cloud.data;
                lastLocalUpdate = cloud.lastUpdated;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
                localStorage.setItem(TS_KEY, lastLocalUpdate);
                render();
                updateSyncUI('online', 'Vừa cập nhật');
            } else {
                updateSyncUI('online');
            }
        } catch (e) {
            updateSyncUI('offline');
        }
    }

    function startRealtimeEngine() {
        pullCloud(); // Pull lần đầu
        setInterval(pullCloud, 10000); // Polling mỗi 10s
    }

    // 4. UI RENDER & EXTRAS
    function render() {
        const tbody = document.getElementById('mainTable');
        const s = document.getElementById('searchBox').value.toLowerCase();
        tbody.innerHTML = '';
        inventory.forEach((item, idx) => {
            if (item.name.toLowerCase().includes(s) || item.sn.toLowerCase().includes(s) || item.warehouse.toLowerCase().includes(s)) {
                let badge = item.auditStatus ? `<span class="badge ${item.auditStatus === 'OK' ? 'audit-ok' : 'audit-missing'}">${item.auditStatus}</span>` : '-';
                tbody.innerHTML += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td style="text-align:left; font-weight:600">${item.name}</td>
                        <td style="color:#64748b">${item.pn || '-'}</td>
                        <td style="font-family:monospace; color:var(--p)">${item.sn}</td>
                        <td>${item.warehouse} / ${item.loc || '-'}</td>
                        <td>${badge}</td>
                        <td>
                            <button onclick="editItem(${idx})" style="background:var(--edit); padding:6px 10px">Sửa</button>
                            <button onclick="deleteItem(${idx})" style="background:var(--danger); padding:6px 10px">Xóa</button>
                        </td>
                    </tr>`;
            }
        });
    }

    function clearForm() { document.querySelectorAll('.form-grid input').forEach(i => i.value = i.id==='inQty'?'1':''); }
    function cancelEdit() { document.getElementById('editIndex').value = "-1"; document.getElementById('btnAdd').style.display = 'inline-flex'; document.getElementById('btnUpdate').style.display = 'none'; document.getElementById('btnCancel').style.display = 'none'; clearForm(); render(); }
    function openAuditModal() { document.getElementById('auditOverlay').style.display = 'flex'; }
    function closeAuditModal() { document.getElementById('auditOverlay').style.display = 'none'; }
    
    function exportToExcel() {
        const ws = XLSX.utils.json_to_sheet(inventory);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "CNS_Assets");
        XLSX.writeFile(wb, "CNS_Inventory_Realtime.xlsx");
    }

    // (Các hàm generateStockReport & generateAuditReport giữ nguyên như bản trước)
    function generateStockReport() { /* ... Logic như bản cũ ... */ alert("Tính năng In đang được chuẩn bị..."); }
</script>
</body>
</html>
